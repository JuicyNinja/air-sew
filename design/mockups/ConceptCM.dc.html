<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept C — Altitude (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..500,0..100,0..1&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--white:#fff;--sky:#eef3f9;--paper:#f8f7f4;--ink:#14243d;--muted:#4e5a6d;--navy:#18335f;--deep:#10264a;--line:#e3e7ed;--needle:#b71c1c}
body{margin:0;background:#fff}
.c{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.c a{color:var(--navy)}
.f{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100,'WONK' 0}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border:0;border-radius:12px;font:600 16px 'Manrope',sans-serif;text-decoration:none;cursor:pointer}
.btn.red{background:var(--needle);color:#fff}.btn.navy{background:var(--navy);color:#fff}
.stage{border:0;background:none;text-align:left;font:inherit;color:var(--muted);padding:18px 0 18px 24px;border-left:2px solid var(--line);cursor:pointer;width:100%}
.stage[aria-pressed=true]{color:var(--ink);border-left-color:var(--navy)}
.stage:focus-visible,.btn:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.fade{transition:opacity .5s ease}
@media (prefers-reduced-motion:reduce){.fade{transition:none}}
</style>
</helmet>
<div class="c" style="max-width:390px;margin:0 auto">
<header style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:64px"><img src="../assets/logo/air-sew-logo.png" alt="Air Sew" style="height:30px"><span style="font-size:15px;font-weight:500">Menu</span></header>
<section style="padding:48px 20px 32px;text-align:center">
  <h1 class="f" style="font-weight:300;font-size:52px;line-height:52px;letter-spacing:-.03em;margin:0">From worn out to one of a kind.</h1>
  <p style="font-size:17px;line-height:27px;color:var(--muted);margin:20px 0 28px">Comfortable, personal cabins, from an owner-operated shop that shows you every stage.</p>
  <a href="#" class="btn red" style="width:100%;box-sizing:border-box">Start your design</a>
</section>
<section style="padding:0 12px 56px"><img src="../assets/img/hero-after.jpg" alt="Finished cabin" style="display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px"></section>
<section style="background:var(--sky);padding:56px 20px">
  <h2 class="f" style="font-weight:400;font-size:34px;line-height:38px;margin:0 0 20px">What happens to your cabin.</h2>
  <div style="position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;margin-bottom:16px"><img src="../assets/img/hero-before.jpg" alt="Arrives" class="fade" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{so0}}"><img src="../assets/img/seat-frame.jpg" alt="Stripped" class="fade" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{so1}}"><img src="../assets/img/hands-sewing.jpg" alt="Built" class="fade" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{so2}}"><img src="../assets/img/hero-after.jpg" alt="Delivered" class="fade" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{so3}}"></div>
  <div role="group" aria-label="Stages"><button type="button" class="stage" aria-pressed="{{sp0}}" onClick="{{go0}}" style="padding:14px 0 14px 18px"><span style="display:block;font-size:17px;font-weight:600">Arrives</span><span style="display:{{sd0}};font-size:15px;line-height:24px;margin-top:4px">Your cabin as it flies in: photographed, measured, every worn spot noted in your quote.</span></button><button type="button" class="stage" aria-pressed="{{sp1}}" onClick="{{go1}}" style="padding:14px 0 14px 18px"><span style="display:block;font-size:17px;font-weight:600">Stripped</span><span style="display:{{sd1}};font-size:15px;line-height:24px;margin-top:4px">Seats down to the frame. Structure, rails and mechanisms inspected and signed off.</span></button><button type="button" class="stage" aria-pressed="{{sp2}}" onClick="{{go2}}" style="padding:14px 0 14px 18px"><span style="display:block;font-size:17px;font-weight:600">Built</span><span style="display:{{sd2}};font-size:15px;line-height:24px;margin-top:4px">New foam, your leather and stitch, cut by machine and finished by hand.</span></button><button type="button" class="stage" aria-pressed="{{sp3}}" onClick="{{go3}}" style="padding:14px 0 14px 18px"><span style="display:block;font-size:17px;font-weight:600">Delivered</span><span style="display:{{sd3}};font-size:15px;line-height:24px;margin-top:4px">Reinstalled, logbook entries made, burn certs in your records. One of a kind.</span></button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 0 }; }
  renderVals() {
    const s = this.state.s, v = {};
    for (let i = 0; i < 4; i++) { const on = s === i; v['sp' + i] = String(on); v['sd' + i] = on ? 'block' : 'none'; v['so' + i] = on ? 1 : 0; v['go' + i] = () => this.setState({ s: i }); }
    return v;
  }
}
</script>
</body>
</html>
