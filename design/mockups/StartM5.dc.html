<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Sew — Start 5 (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#fff}
a{color:#18335f}
*{box-sizing:border-box}
.eb{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#18335f}
.eb:before{content:"";width:16px;height:2px;border-radius:2px;background:#b71c1c}
.h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:40px;line-height:44px;letter-spacing:-.02em;margin:12px 0 16px}
.h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:28px;line-height:34px;letter-spacing:-.01em;margin:8px 0 12px}
.h3{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:20px;line-height:28px;margin:0}
.lead{font-size:17px;line-height:27px;color:#566174;margin:0 0 24px}
.body{font-size:16px;line-height:26px;color:#566174;margin:0}
.sm{font-size:14px;line-height:22px;color:#566174}
.xs{font-size:12px;line-height:18px;color:#566174}
.sec{padding:64px 20px}.alt{background:#f8f7f4}.sky{background:#eef3f9}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:10px;background:#18335f;color:#fff;font-size:16px;font-weight:600;text-decoration:none;border:0;font-family:inherit;cursor:pointer;width:100%}
.btn.o{background:transparent;border:1.5px solid #18335f;color:#18335f}
.btn.red{background:#b71c1c}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid #e3e7ed;border-radius:999px;background:#fff;font-size:14px;color:#14243d;text-decoration:none;white-space:nowrap}
.ph{display:block;width:100%;object-fit:cover;border-radius:14px}
.row{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #e3e7ed;text-decoration:none;color:#14243d}
.swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.swipe>*{flex:0 0 78%;scroll-snap-align:start}
.card{display:flex;flex-direction:column;gap:10px;padding:10px 10px 16px;border:1px solid #e3e7ed;border-radius:14px;background:#fff;text-decoration:none;color:#14243d}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.faq{border-bottom:1px solid #e3e7ed}
.faq button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:16px;padding:20px 0;font-size:16px;font-weight:600;color:#14243d;cursor:pointer}
.mbar{position:sticky;bottom:0;z-index:6;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e3e7ed}
.lbl{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.inp{width:100%;min-height:52px;padding:0 14px;border:1.5px solid #8590a2;border-radius:8px;font-family:inherit;font-size:17px;color:#14243d;background:#fff}
.badge{position:absolute;padding:3px 10px;border-radius:999px;background:#fff;font-size:12px;font-weight:600;color:#14243d}
</style>
</helmet>
<div style="font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#14243d;background:#fff;-webkit-font-smoothing:antialiased;max-width:390px;margin:0 auto;position:relative">
<div style="min-height:844px;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:5;background:#fff;padding:4px 16px 12px;border-bottom:1px solid #e3e7ed">
  <div style="display:flex;justify-content:space-between;align-items:center"><a href="StartM4.dc.html" style="font-size:15px;font-weight:500;text-decoration:none;padding:12px 0">‹ Back</a><span class="xs" style="font-weight:600;color:#14243d">Step 5 of 6</span><a href="tel:+10000000000" style="font-size:15px;font-weight:500;text-decoration:none;padding:12px 0">Call</a></div>
  <div role="progressbar" aria-label="Progress" aria-valuenow="5" aria-valuemin="1" aria-valuemax="6" style="height:4px;border-radius:999px;background:#e3e7ed"><span style="display:block;width:83.3%;height:4px;border-radius:999px;background:#18335f"></span></div>
</header>
<main style="flex:1 1 auto;padding:24px 20px 24px">
  <h1 class="h2" style="margin-top:0">Your Bonanza, reimagined.</h1>
  <div style="position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;margin-top:8px"><img src="{{img}}" alt="{{alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span class="badge" style="left:10px;top:10px">{{badge}}</span></div>
  <div role="group" aria-label="Compare" style="display:flex;padding:4px;margin:12px 0 16px;background:#f8f7f4;border:1px solid #e3e7ed;border-radius:999px">
    <button type="button" aria-pressed="{{pb}}" onClick="{{showB}}" style="flex:1 1 0;min-height:40px;border:0;border-radius:999px;font:inherit;font-weight:600;background:{{bBg}};color:{{bFg}}">Before</button>
    <button type="button" aria-pressed="{{pa}}" onClick="{{showA}}" style="flex:1 1 0;min-height:40px;border:0;border-radius:999px;font:inherit;font-weight:600;background:{{aBg}};color:{{aFg}}">Concept</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip" style="min-height:32px;font-size:13px">Modern</span><span class="chip" style="min-height:32px;font-size:13px">Warm neutral</span><span class="chip" style="min-height:32px;font-size:13px">Leather</span><span class="chip" style="min-height:32px;font-size:13px">Channel stitch</span></div>
  <a href="#" style="display:block;margin:16px 0 8px;font-weight:600;text-decoration:none">↻ Try another version (2 left)</a>
  <p class="xs">Concept made by AI from your photo and answers. Final materials, colors and layout are set with our designer.</p></main>
<div class="mbar" style="flex-direction:column;gap:4px"><a href="StartM6.dc.html" class="btn">Send my design to Air Sew</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: true }; }
  renderVals() { const s = this.state; const a = s.a !== false;
    return { img: a ? '../assets/img/hero-after.jpg' : '../assets/img/hero-before.jpg', alt: a ? 'Concept render of your cabin' : 'Your photo: the cabin today', badge: a ? 'Concept render' : 'Your photo',
      pa: String(a), pb: String(!a), showA: () => this.setState({a:true}), showB: () => this.setState({a:false}),
      aBg: a?'#18335f':'transparent', aFg: a?'#fff':'#14243d', bBg: a?'transparent':'#18335f', bFg: a?'#14243d':'#fff' }; }
}
</script>
</body>
</html>
