<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept B — Atelier (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--white:#ffffff;--felt:#eceef1;--ink:#16202e;--navy:#18335f;--deep:#0f1d33;--muted:#545e6c;--needle:#b71c1c}
body{margin:0;background:#fff}
.b{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.b a{color:var(--navy)}
.serif{font-family:'Bodoni Moda',Didot,serif;font-optical-sizing:auto}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:0;border-radius:999px;font:600 16px 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer}
.btn.red{background:var(--needle);color:#fff}.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.seam{stroke:var(--needle);stroke-width:2;stroke-dasharray:10 8;fill:none}
@keyframes sew{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sew-rect{transform-origin:0 0;animation:sew 2.4s .3s cubic-bezier(.2,.6,.2,1) both}
@media (prefers-reduced-motion:reduce){.sew-rect{animation:none}}
.grip{position:absolute;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:999px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:18px;pointer-events:none}
.range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
</style>
</helmet>
<div class="b" style="max-width:390px;margin:0 auto">
<header style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:60px"><img src="../assets/logo/air-sew-logo.png" alt="Air Sew" style="height:28px"><span style="font-size:15px;font-weight:500">Menu</span></header>
<section style="position:relative;height:700px;overflow:hidden;background:#222">
  <img src="../assets/img/hero-after.jpg" alt="After: cream leather club seats" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <img src="../assets/img/hero-before.jpg" alt="Before: the same cabin, worn and faded" style="{{beforeClip}}">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,28,0) 45%,rgba(10,16,28,.72) 100%);pointer-events:none"></div>
  <span style="position:absolute;top:0;bottom:0;left:{{pos}}%;width:2px;background:#fff;pointer-events:none"></span>
  <span class="grip" style="left:{{pos}}%" aria-hidden="true">⟷</span>
  <input class="range" type="range" min="0" max="100" value="{{pos}}" onInput="{{slide}}" aria-label="Drag to compare the cabin before and after">
  <div style="position:absolute;left:0;right:0;bottom:36px;pointer-events:none"><div class="wrap" style="padding:0 20px">
    <h1 class="serif" style="font-weight:400;font-size:52px;line-height:54px;letter-spacing:-.01em;color:#fff;margin:0;max-width:11em">From worn out to one of a kind.</h1>
    <div style="pointer-events:auto"><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px"><a href="#" class="btn red">Start your design</a></div></div>
  </div></div>
</section>
<svg viewBox="0 0 1440 24" preserveAspectRatio="none" width="100%" height="24" aria-hidden="true" style="display:block"><defs><clipPath id="sew"><rect class="sew-rect" x="0" y="0" width="1440" height="24"/></clipPath></defs><path class="seam" clip-path="url(#sew)" d="M0 12 H1440"/></svg>
<section style="padding:64px 20px">
  <img src="../assets/img/portrait-craftsman.jpg" alt="[Name], owner of Air Sew" style="width:100%;aspect-ratio:4/5;object-fit:cover">
  <h2 class="serif" style="font-weight:400;font-size:36px;line-height:40px;margin:28px 0 0">One owner. One shop. Your airplane never gets passed down the line.</h2>
  <p style="font-size:15px;margin:16px 0 0;font-weight:600">[Name], owner</p>
</section>
<section><div style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:2px">
  <img src="../assets/img/perforated.jpg" alt="Perforated leather" style="flex:0 0 78%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start">
  <img src="../assets/img/diamond.jpg" alt="Diamond quilting" style="flex:0 0 78%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start">
</div></section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pos: 50 }; }
  renderVals() {
    const pos = this.state.pos;
    return { pos, slide: (e) => this.setState({ pos: Number(e.target.value) }),
      beforeClip: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 ' + (100 - pos) + '% 0 0)' };
  }
}
</script>
</body>
</html>
