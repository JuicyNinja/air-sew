<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept A — Logbook (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#ffffff;--draft:#f3f5f8;--ink:#14243d;--navy:#18335f;--muted:#4f5b6e;--rule:#c5cdd8;--hair:#e2e7ee;--needle:#b71c1c}
body{margin:0;background:var(--paper)}
.a{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 100;color:var(--ink);-webkit-font-smoothing:antialiased}
.a a{color:var(--navy)}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:'tnum'}
.wrap{max-width:1232px;margin:0 auto;padding:0 32px}
.d1{font-weight:500;font-variation-settings:'wdth' 112;font-size:76px;line-height:78px;letter-spacing:-.025em;margin:0}
.d2{font-weight:500;font-variation-settings:'wdth' 112;font-size:44px;line-height:50px;letter-spacing:-.02em;margin:0}
.lead{font-size:20px;line-height:31px;color:var(--muted);margin:0;max-width:34em}
.body{font-size:17px;line-height:28px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:56px;padding:0 28px;border:0;border-radius:4px;font:600 16px 'Archivo',sans-serif;cursor:pointer;text-decoration:none}
.btn.red{background:var(--needle);color:#fff}.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.plate{border:1px solid var(--ink);border-radius:2px;background:#fff}
.plate dl{display:grid;grid-template-columns:150px 1fr;margin:0}
.plate dt,.plate dd{margin:0;padding:12px 20px;border-top:1px solid var(--hair);font-size:15px}
.plate dt{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);font:600 15px 'Archivo',sans-serif;padding:0 22px;min-height:44px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.pin{position:absolute;width:34px;height:34px;border-radius:999px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font:600 14px 'IBM Plex Mono',monospace;box-shadow:0 0 0 1.5px var(--ink),0 0 0 6px rgba(255,255,255,.55)}
@keyframes resolve{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.found{animation:resolve .4s ease-out both}
@media (prefers-reduced-motion:reduce){.found{animation:none}}
</style>
</helmet>
<div class="a" style="max-width:390px;margin:0 auto">
<header style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:60px;border-bottom:1px solid var(--hair)"><img src="../assets/logo/air-sew-logo.png" alt="Air Sew" style="height:28px"><span style="font-size:15px;font-weight:500">Menu</span></header>
<section style="padding:36px 20px 40px">
  <p class="mono" style="font-size:12px;color:var(--muted);margin:0 0 18px">FAA Part 145 repair station [cert no.]</p>
  <h1 class="d1" style="font-size:42px;line-height:44px">Tell us your tail number. We'll show you what your cabin can become.</h1>
  <p class="lead" style="font-size:17px;line-height:27px;margin-top:18px">FAA lookup, ten questions, a concept of your own cabin.</p>
  <label for="mt" style="display:block;font-size:15px;font-weight:600;margin:28px 0 8px">Tail number</label>
  <div style="display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden"><span class="mono" style="display:flex;align-items:center;padding:0 14px;font-size:22px;background:var(--draft);border-right:1.5px solid var(--ink)">N</span><input id="mt" class="mono" value="12345" style="flex:1;min-width:0;border:0;font-size:22px;padding:0 14px;min-height:56px;letter-spacing:.06em"></div>
  <button type="button" class="btn red" onClick="{{find}}" style="width:100%;margin-top:12px">Find my aircraft</button>
  <div class="plate" style="margin-top:24px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px"><span class="mono" style="font-size:22px;font-weight:500">N12345</span><span class="mono" style="font-size:12px;color:{{plateStatusColor}}">{{plateStatus}}</span></div>
    <dl class="{{plateClass}}" style="grid-template-columns:120px 1fr"><dt>Aircraft</dt><dd>{{v_model}}</dd><dt>Seats</dt><dd class="mono">{{v_seats}}</dd><dt>Burn standard</dt><dd>{{v_burn}}</dd></dl>
    <div style="border-top:1px solid var(--hair);padding:12px;opacity:{{planOpacity}}"><svg viewBox="0 0 520 190" width="100%" role="img" aria-label="Top-down seat plan, club layout" style="display:block">
  <path d="M18 95 C18 58 52 44 104 42 L430 46 C470 48 500 70 502 95 C500 120 470 142 430 144 L104 148 C52 146 18 132 18 95Z" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <path d="M250 46 L300 4 L360 4 L330 46 M250 144 L300 186 L360 186 L330 144" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <path d="M96 52 V138" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>
  <g fill="none" stroke="var(--ink)" stroke-width="1">
    <rect x="120" y="56" width="46" height="34" rx="6"/><rect x="120" y="100" width="46" height="34" rx="6"/>
    <rect x="236" y="56" width="46" height="34" rx="6"/><rect x="236" y="100" width="46" height="34" rx="6"/>
    <rect x="322" y="56" width="46" height="34" rx="6"/><rect x="322" y="100" width="46" height="34" rx="6"/>
  </g>
  <g stroke="var(--ink)" stroke-width="3" stroke-linecap="round"><path d="M166 58V88M166 102V132M368 58V88M368 102V132M236 58V88M236 102V132"/></g>
  <path d="M396 144 V156 H460 V142" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)"><text x="40" y="99">PANEL</text><text x="404" y="170">AFT DOORS</text><text x="128" y="172">ROW 1</text><text x="240" y="172">ROW 2 · CLUB</text><text x="326" y="172">ROW 3</text></g>
</svg></div>
  </div>
</section>
<section style="background:var(--draft);padding:48px 20px">
  <h2 class="d2" style="font-size:32px;line-height:36px">Every surface, accounted for.</h2>
  <figure style="margin:20px 0 0;position:relative;aspect-ratio:4/3"><img src="{{cmpImg}}" alt="{{cmpAlt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span class="pin" style="left:38%;top:58%">1</span><span class="pin" style="left:10%;top:38%">2</span><span class="pin" style="left:46%;top:8%">3</span></figure>
  <div class="seg" role="group" aria-label="Compare" style="margin-top:16px;display:flex"><button type="button" style="flex:1" aria-pressed="{{pb}}" onClick="{{showB}}">Before</button><button type="button" style="flex:1" aria-pressed="{{pa}}" onClick="{{showA}}">After</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { found: false, after: true }; }
  renderVals() {
    const f = this.state.found, a = this.state.after;
    return {
      find: () => this.setState({ found: true }),
      plateStatus: f ? 'Registration valid' : 'Waiting for lookup',
      plateStatusColor: f ? '#2b6a4a' : '#4f5b6e',
      plateClass: f ? 'found' : '',
      v_model: f ? 'Beechcraft A36 Bonanza' : '—', v_year: f ? '1998 · [E-0000]' : '—', v_seats: f ? '6' : '—', v_burn: f ? 'Part 23' : '—',
      planOpacity: f ? 1 : 0.25,
      pa: String(a), pb: String(!a), showA: () => this.setState({ after: true }), showB: () => this.setState({ after: false }),
      cmpImg: a ? '../assets/img/hero-after.jpg' : '../assets/img/hero-before.jpg', cmpAlt: a ? 'After: cream leather club seats' : 'Before: worn, faded seats'
    };
  }
}
</script>
</body>
</html>
