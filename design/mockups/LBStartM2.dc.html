<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Sew — Start your design, step 2 (Logbook, mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#ffffff;--draft:#f3f5f8;--ink:#14243d;--navy:#18335f;--navy-deep:#10264a;--muted:#4f5b6e;--rule:#c5cdd8;--hair:#e2e7ee;--needle:#b71c1c;--valid:#2b6a4a;--control:#8590a2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper)}
.lb{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 100;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:17px;line-height:28px}
.lb a{color:var(--navy)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-feature-settings:'tnum'}
.wrap{max-width:1232px;margin:0 auto;padding:0 32px}
.d1{font-weight:500;font-variation-settings:'wdth' 112;font-size:76px;line-height:78px;letter-spacing:-.025em;margin:0}
.d2{font-weight:500;font-variation-settings:'wdth' 112;font-size:44px;line-height:50px;letter-spacing:-.02em;margin:0}
.d3{font-weight:600;font-variation-settings:'wdth' 106;font-size:22px;line-height:30px;margin:0}
.lead{font-size:20px;line-height:31px;color:var(--muted);margin:0;max-width:34em}
.body{font-size:17px;line-height:28px;color:var(--muted);margin:0}
.small{font-size:15px;line-height:24px;color:var(--muted)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:20px;color:var(--muted)}
.sec{padding:120px 0}.sec.tight{padding:88px 0}.draft{background:var(--draft)}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:56px;padding:0 28px;border:0;border-radius:4px;font:600 16px 'Archivo',sans-serif;cursor:pointer;text-decoration:none}
.btn.red{background:var(--needle);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.sm{min-height:44px;padding:0 18px;font-size:15px}
.lb :focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.plate{border:1px solid var(--ink);border-radius:2px;background:#fff}
.plate dl{display:grid;grid-template-columns:150px 1fr;margin:0}
.plate dt,.plate dd{margin:0;padding:12px 20px;border-top:1px solid var(--hair);font-size:15px;line-height:24px}
.plate dt{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);font:600 15px 'Archivo',sans-serif;padding:0 22px;min-height:44px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.tail{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff}
.tail span{display:flex;align-items:center;padding:0 16px;font-size:24px;background:var(--draft);border-right:1.5px solid var(--ink)}
.tail input{flex:1 1 auto;min-width:0;border:0;font-size:24px;padding:0 16px;min-height:58px;color:var(--ink);letter-spacing:.06em;text-transform:uppercase;background:#fff}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
.field input{width:100%;min-height:52px;border:1.5px solid var(--control);border-radius:4px;padding:0 14px;font:400 17px 'Archivo',sans-serif;color:var(--ink);background:#fff}
.pin{position:absolute;width:34px;height:34px;border-radius:999px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font:600 14px 'IBM Plex Mono',monospace;box-shadow:0 0 0 1.5px var(--ink),0 0 0 6px rgba(255,255,255,.55);pointer-events:none}
.wiper{position:relative;overflow:hidden;background:#cfd6df;touch-action:pan-y}
.wiper img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wiper .seam{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.wiper .grip{position:absolute;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:999px;background:#fff;box-shadow:0 0 0 1.5px var(--ink),0 8px 24px rgba(20,36,61,.25);display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:none}
.wiper .grip i{display:block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent}
.wiper .grip i:first-child{border-right:8px solid var(--ink)}.wiper .grip i:last-child{border-left:8px solid var(--ink)}
.wiper input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.wiper input[type=range]:focus-visible + .focus{outline:3px solid #fff;outline-offset:-6px}
.wiper .focus{position:absolute;inset:0;pointer-events:none}
.wiper .lbl{position:absolute;top:20px;padding:4px 10px;background:#fff;color:var(--ink);font:500 13px 'IBM Plex Mono',monospace;border-radius:2px;pointer-events:none}
.faq{border-top:1px solid var(--rule)}
.faq button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:24px;padding:22px 0;font-size:18px;font-weight:600;color:var(--ink);cursor:pointer}
.faq button:focus-visible{outline:2px solid var(--navy);outline-offset:4px}
.reg{width:100%;border-collapse:collapse}
.reg th{font:500 13px 'IBM Plex Mono',monospace;color:var(--muted);text-align:left;padding:12px 20px 12px 0;border-bottom:1.5px solid var(--ink)}
.reg td{padding:16px 20px 16px 0;border-bottom:1px solid var(--hair);font-size:16px;line-height:24px;vertical-align:top}
@keyframes resolve{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.found{animation:resolve .4s ease-out both}
@media (prefers-reduced-motion:reduce){.found{animation:none}}

.lb.m .wrap{padding:0 20px}
.lb.m .d1{font-size:42px;line-height:44px}
.lb.m .d2{font-size:30px;line-height:34px}
.lb.m .lead{font-size:17px;line-height:27px}
.lb.m .body{font-size:16px;line-height:26px}
.lb.m .sec{padding:56px 0}
.lb.m .plate dl{grid-template-columns:118px 1fr}
.lb.m .plate dt,.lb.m .plate dd{padding:11px 14px}
.lb.m .tail span{font-size:22px;padding:0 14px}
.lb.m .tail input{font-size:22px;min-height:56px}
.lb.m .btn{min-height:54px}
.swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:0 20px 4px;margin:0 -20px;scrollbar-width:none}
.swipe>*{flex:0 0 80%;scroll-snap-align:start}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:600 15px 'Archivo',sans-serif;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.mbar{position:sticky;bottom:0;z-index:7;display:flex;gap:8px;padding:12px 16px;background:rgba(255,255,255,.97);border-top:1px solid var(--hair)}
</style>
</helmet>
<div class="lb m" style="max-width:390px;margin:0 auto;position:relative">
<div style="min-height:844px;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:5;background:#fff;padding:4px 16px 12px;border-bottom:1px solid var(--hair)">
  <div style="display:flex;justify-content:space-between;align-items:center"><a href="LBStartM1.dc.html" style="font-size:15px;font-weight:600;text-decoration:none;padding:12px 0">Back</a><span class="tag" style="color:var(--ink)">02 / 06  Confirm</span><a href="tel:+10000000000" style="font-size:15px;font-weight:600;text-decoration:none;padding:12px 0">Call</a></div>
  <div style="display:flex;gap:4px" aria-hidden="true"><span style="flex:1;height:3px;background:var(--ink)"></span><span style="flex:1;height:3px;background:var(--ink)"></span><span style="flex:1;height:3px;background:var(--hair)"></span><span style="flex:1;height:3px;background:var(--hair)"></span><span style="flex:1;height:3px;background:var(--hair)"></span><span style="flex:1;height:3px;background:var(--hair)"></span></div>
</header>
<main style="flex:1;padding:24px 20px"><p class="tag" style="margin:0">Found on the FAA registry</p><h1 class="d2" style="margin-top:6px">Is this your aircraft?</h1>
<div class="plate" style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:baseline;padding:14px"><span class="mono" style="font-size:22px;font-weight:500">N12345</span><span class="mono" style="font-size:12px;color:var(--valid)">Registration valid</span></div>
<dl><dt>Aircraft</dt><dd>1998 Beechcraft A36 Bonanza</dd><dt>Serial</dt><dd class="mono">[E-0000]</dd><dt>Seats</dt><dd class="mono">6</dd><dt>Burn standard</dt><dd>Part 23</dd></dl>
<div style="border-top:1px solid var(--hair);padding:12px"><svg viewBox="0 0 520 190" width="100%" role="img" aria-label="Top-down seat plan, club layout" style="display:block">
  <path d="M18 95 C18 58 52 44 104 42 L430 46 C470 48 500 70 502 95 C500 120 470 142 430 144 L104 148 C52 146 18 132 18 95Z" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <path d="M250 46 L300 4 L360 4 L330 46 M250 144 L300 186 L360 186 L330 144" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <path d="M96 52 V138" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>
  <g fill="none" stroke="var(--ink)" stroke-width="1">
    <rect x="120" y="56" width="46" height="34" rx="6"/><rect x="120" y="100" width="46" height="34" rx="6"/>
    <rect x="236" y="56" width="46" height="34" rx="6"/><rect x="236" y="100" width="46" height="34" rx="6"/>
    <rect x="322" y="56" width="46" height="34" rx="6"/><rect x="322" y="100" width="46" height="34" rx="6"/>
  </g>
  <g stroke="var(--ink)" stroke-width="3" stroke-linecap="round"><path d="M166 58V88M166 102V132M368 58V88M368 102V132M236 58V88M236 102V132"/></g>
  <path d="M396 144 V156 H460 V142" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)"><text x="40" y="99">PANEL</text><text x="404" y="170">AFT DOORS</text><text x="128" y="172">ROW 1</text><text x="236" y="172">ROW 2</text><text x="326" y="172">ROW 3</text></g>
</svg></div></div></main>
<div class="mbar" style="flex-direction:column;gap:4px"><a href="LBStartM3.dc.html" class="btn red">Yes, that's my aircraft</a><a href="LBStartM1.dc.html" style="text-align:center;padding:10px 0;font-size:15px;font-weight:600">Not my aircraft</a></div>
</div>
</div>
