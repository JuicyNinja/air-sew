<!-- @dsCard group="Content" height=500 width=1100 subtitle="Service cards in a three-up grid" -->
<div class="as-root" style="padding:48px 32px;background:var(--paper)">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1100px;margin:0 auto">
    <article class="as-card">
      <div class="as-card__media"></div>
      <h3>Seats &amp; upholstery</h3>
      <p>Strip to the frame, new foam and leather, stitched to your pattern.</p>
      <a class="as-card__link" href="#">Seats →</a>
    </article>
    <article class="as-card">
      <div class="as-card__media" style="background:var(--sky)"></div>
      <h3>Cabin panels</h3>
      <p>Sidewalls, headliners and plastics repaired, refinished or remade.</p>
      <a class="as-card__link" href="#">Panels →</a>
    </article>
    <article class="as-card">
      <div class="as-card__media"></div>
      <h3>Carpet &amp; soft goods</h3>
      <p>Bound carpet, bulkhead covers and custom embroidery.</p>
      <a class="as-card__link" href="#">Soft goods →</a>
    </article>
  </div>
</div>
